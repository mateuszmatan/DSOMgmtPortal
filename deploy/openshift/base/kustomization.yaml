apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: dso-portal
      app.kubernetes.io/part-of: devsecops
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: dso-portal-config
    literals:
      - SPRING_PROFILES_ACTIVE=rd
      - INFLUX_URL=
      - INFLUX_ORG=DevSecOps
      - INFLUX_BUCKET=DORA-metrics
      - GRAFANA_URL=
      - GRAFANA_ORG_ID=1
