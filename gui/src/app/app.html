<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-name"><strong>BBH</strong> DevSecOps Management Portal</span>
      </a>
      <nav class="menu" aria-label="Main">
        @for (item of navigation; track item.path) {
          <a
            class="menu-link"
            [routerLink]="item.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            >{{ item.label }}</a
          >
        }
      </nav>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
