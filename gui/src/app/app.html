<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-name"><strong>BBH</strong> DevSecOps Management Portal</span>
      </a>
      <nav class="menu" aria-label="Main">
        @for (menu of menus; track menu.label) {
          <div class="menu-group" routerLinkActive="active">
            <button type="button" class="menu-trigger" [matMenuTriggerFor]="items">
              {{ menu.label }}
            </button>
            <mat-menu #items="matMenu" [aria-label]="menu.label">
              @for (item of menu.sections; track item.path) {
                <a
                  mat-menu-item
                  class="menu-item"
                  [routerLink]="item.path"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                  >{{ item.label }}</a
                >
              }
            </mat-menu>
          </div>
        }
      </nav>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
