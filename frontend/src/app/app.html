<div class="shell">
  <header class="topbar">
    <div class="brand-row">
      <a class="brand" routerLink="/">
        <span class="mark" aria-hidden="true"><mat-icon>shield</mat-icon></span>
        <span class="brand-name"><strong>BBH</strong> DevSecOps Management Portal</span>
      </a>
    </div>
    <nav class="tabs" aria-label="Main">
      <div class="tabs-inner">
        @for (item of navigation; track item.path) {
          <a class="tab" [routerLink]="item.path" routerLinkActive="active" [attr.title]="item.hint">
            <span class="tab-label">{{ item.label }}</span>
            <span class="tab-hint">{{ item.hint }}</span>
          </a>
        }
      </div>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
