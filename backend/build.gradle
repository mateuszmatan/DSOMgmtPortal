plugins {
    id 'groovy'
    id 'jacoco'
    id 'java-test-fixtures'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

description = 'REST API of the DevSecOps management portal, serving the gui module'

base {
    archivesName = 'dso-portal'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def withGui = !providers.gradleProperty('skipGui').map { it != 'false' }.getOrElse(false)

configurations {
    gui {
        canBeConsumed = false
        canBeResolved = true
    }
    testFixturesApi.extendsFrom implementation
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.yaml:snakeyaml'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    runtimeOnly 'com.h2database:h2'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesApi libs.groovy
    testFixturesApi libs.groovy.json
    testFixturesApi platform(libs.spock.bom)
    testFixturesApi libs.spock.core
    testFixturesApi libs.spock.spring

    if (withGui) {
        gui project(path: ':gui', configuration: 'guiDist')
    }
}

def guiResources = layout.buildDirectory.dir('gui-resources')

def bundleGui = tasks.register('bundleGui', Sync) {
    description = 'Copies the built gui module to static/ so the portal serves it.'
    from configurations.gui
    into guiResources.map { it.dir('static') }
}

def guiClasspath = files(guiResources).builtBy(bundleGui)

tasks.named('bootJar') {
    from(configurations.gui) {
        into 'BOOT-INF/classes/static'
    }
}

tasks.named('bootRun') {
    classpath(guiClasspath)
}

def forward(Test task, String... names) {
    names.each { name ->
        def value = providers.systemProperty(name).orNull
        if (value != null) {
            task.systemProperty name, value
        }
    }
}

testing {
    suites {
        configureEach {
            useJUnitJupiter()
            targets.configureEach {
                testTask.configure {
                    jvmArgs '-XX:+EnableDynamicAgentLoading'
                    testLogging {
                        events 'failed'
                        exceptionFormat = 'full'
                    }
                }
            }
        }

        test {
            dependencies {
                implementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
                implementation libs.archunit.junit5
            }
            targets.configureEach {
                testTask.configure {
                    finalizedBy tasks.named('jacocoTestReport')
                }
            }
        }

        regressionTest(JvmTestSuite) {
            dependencies {
                implementation project()
                implementation testFixtures(project())
            }
            targets.configureEach {
                testTask.configure {
                    description = 'Runs the API end to end on H2 in Oracle mode.'
                    shouldRunAfter tasks.named('test')
                    systemProperty 'regression.expectedDir', file('src/regressionTest/resources/regression').absolutePath
                    forward(it, 'regression.updateExpected')
                }
            }
        }

        smokeTest(JvmTestSuite) {
            dependencies {
                implementation project()
                implementation testFixtures(project())
                if (withGui) {
                    runtimeOnly guiClasspath
                }
            }
            targets.configureEach {
                testTask.configure {
                    description = 'Starts the portal with demo data and checks health, the API and the UI.'
                    shouldRunAfter tasks.named('regressionTest')
                    forward(it, 'smoke.baseUrl', 'smoke.ui')
                    outputs.upToDateWhen { false }
                    outputs.cacheIf { false }
                }
            }
        }

        performanceTest(JvmTestSuite) {
            dependencies {
                implementation project()
                implementation testFixtures(project())
            }
            targets.configureEach {
                testTask.configure {
                    description = 'Measures the p95 latencies of the main calls on a large catalogue.'
                    shouldRunAfter tasks.named('smokeTest')
                    systemProperty 'performance.report', layout.buildDirectory.file('reports/performance/performance-report.md').get().asFile.absolutePath
                    forward(it, 'performance.factor')
                    outputs.upToDateWhen { false }
                    outputs.cacheIf { false }
                }
            }
        }
    }
}

[tasks.named('regressionTest'), tasks.named('smokeTest'), tasks.named('performanceTest')].each { suite ->
    suite.configure {
        extensions.getByType(JacocoTaskExtension).enabled = false
    }
}

tasks.named('check') {
    dependsOn testing.suites.regressionTest, testing.suites.smokeTest, testing.suites.performanceTest
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

def coveredClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
    exclude 'com/bbh/itss/dso/portal/DsoPortalApplication.class'
}

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(coveredClasses)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(coveredClasses)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = providers.gradleProperty('coverage.minimum').getOrElse('0.90') as BigDecimal
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
