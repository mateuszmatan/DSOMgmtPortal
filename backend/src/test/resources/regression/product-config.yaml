projects:
  gateway:
    appId: 3a1b2c3d-1111-4a5b-8c9d-0e1f2a3b4c5d
    buildTool: maven
    deployTarget: openshift
    sourceDir: gateway
    javaPath: /usr/lib/jvm/java-17-openjdk
    appName: payhub-gateway
    artifactName: payhub-gateway.jar
    asoc:
      url: https://bbh.cloud.appscan.com
      keyId: bbh_1c2d3e4f-0000-4abc-9def-123456789abc
      token: hcl-app-scan-account
    influx:
      url: http://qcwsecopsmon1.testbbh.com:8086/api/v2/write?org=DevSecOps&bucket=DORA-metrics&precision=s
      credentialsId: influxdb-token
      enabled: true
      project: payhub-gateway
      env: uat
    tools:
      sonar:
        serverUrl: https://tools.bbh.com/sonar
        projectName: PayHub Gateway
        projectKey: payhub-gateway
      nexusIq:
        serverUrl: https://tools.bbh.com/IQ
        credentialsId: nexusiqP
        application: payhub-gateway
        scanPatterns:
        - '**/target/*.jar'
        - '**/target/*.war'
    sast:
      scanName: payhub-gateway
    dast:
      enabled: true
      targetUrl: https://payhub-uat.testbbh.com
      presenceId: presence-7
    scm:
      bitbucket:
        url: https://bitbucket.bbh.com/projects/PAY/repos/payhub-gateway
        credentialsId: bitbucket-http-credentials
    goldenFix:
      enabled: true
    tests:
      regression:
        jobs:
        - name: PayHub regression
          type: local
          job: payhub/regression-tests
          timeoutMin: 60
    deploy:
      openshift:
        project: payhub-uat
  mobile-app:
    appId: 109f44ac-cc06-4ca0-884e-d944904f7019
    buildTool: flutter
    deployTarget: vm
    sourceDir: mobile
    buildToolAutoSetup: true
    asoc:
      url: https://bbh.cloud.appscan.com
      keyId: bbh_1c2d3e4f-0000-4abc-9def-123456789abc
      token: hcl-app-scan-account
    influx:
      url: http://qcwsecopsmon1.testbbh.com:8086/api/v2/write?org=DevSecOps&bucket=DORA-metrics&precision=s
      credentialsId: influxdb-token
      enabled: true
      project: CONTRACT-mobile-app
      env: test
    tools:
      sonar:
        serverUrl: https://tools.bbh.com/sonar
      nexusIq:
        serverUrl: https://tools.bbh.com/IQ
        credentialsId: nexusiqP
    dast:
      enabled: false
    goldenFix:
      enabled: false
    flutter:
      platform: apk
